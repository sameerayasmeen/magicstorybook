
<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">

        }
        h1, h2, h3, .font-kids {
            font-family: 'Fredoka One', cursive;

    <script>
      // Shim process.env for the browser
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      // Netlify doesn't inject variables into raw HTML/JS without a build step.
      // This shim ensures the Gemini SDK doesn't crash if the variable is missing.
      if (typeof window.process.env.API_KEY === 'undefined') {
        window.process.env.API_KEY = "";
      }
    </script>
    <script type="importmap">

    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
