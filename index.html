
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Storybook AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #fdf6e3;
        }
        h1, h2, h3, .font-kids {
            font-family: 'Fredoka One', cursive;
        }
    </style>
    <script>
      // Shim process.env for the browser to prevent crashes
      window.process = {
        env: {
          // This will be replaced by Netlify if you use a build step, 
          // but for direct static hosting, it ensures the app doesn't break.
          API_KEY: "" 
        }
      };
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19?dev",
    "react-dom": "https://esm.sh/react-dom@19?dev",
    "react-dom/client": "https://esm.sh/react-dom@19/client?dev",
    "@google/genai": "https://esm.sh/@google/genai@1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-amber-50">
    <div id="root"></div>
    <!-- 
      Using data-type="module" tells Babel to transpile this and all its relative imports.
      The 'typescript' and 'react' presets are essential for .tsx files.
    -->
    <script type="text/babel" data-presets="react,typescript" data-type="module" src="index.tsx"></script>
</body>
</html>
