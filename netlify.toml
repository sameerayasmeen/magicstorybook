
[build]
  publish = "."

[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"

# Critical for "no-build" deployments:
# Tells the browser to treat TS/TSX files as JavaScript modules.
[[headers]]
  for = "*.tsx"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "*.ts"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
